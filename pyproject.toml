[project]
name = "boe-extractor"
version = "0.1.0"
description = "Extracción estructurada (JSON) de disposiciones del BOE con un LLM pequeño ajustado con QLoRA"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "polars>=1.0",
]

[project.scripts]
boe-fetch = "boe_extractor.fetch:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pre-commit>=3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/boe_extractor"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
